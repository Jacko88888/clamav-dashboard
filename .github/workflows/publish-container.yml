name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: |
          python -m pip install -r dashboard/requirements.txt
          APP_SOURCE=dashboard/app.py python -m unittest discover -s dashboard/tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jacko88888/clamav-dashboard:0.2.4
            ghcr.io/jacko88888/clamav-dashboard:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Jacko88888/clamav-dashboard
            org.opencontainers.image.version=0.2.4
            org.opencontainers.image.licenses=MIT
